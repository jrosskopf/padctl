name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.b2w_platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            b2w_platform: linux-x86_64
            binary: padctl
          - os: macos-latest
            target: x86_64-apple-darwin
            b2w_platform: macos-x86_64
            binary: padctl
          - os: macos-latest
            target: aarch64-apple-darwin
            b2w_platform: macos-arm64
            binary: padctl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            b2w_platform: windows-x64
            binary: padctl.exe

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux BLE deps
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package wheel
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          pip install vendor/bin-to-wheel
          bin-to-wheel \
            --name padctl \
            --version "$VERSION" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --platform "${{ matrix.b2w_platform }}" \
            --description "Cypherpunk TUI controller for KingSmith WalkingPad via BLE" \
            --author "Joachim Rosskopf" \
            --license "MIT" \
            --url "https://github.com/jrosskopf/padctl" \
            --readme README.md \
            --entry-point padctl \
            --output-dir dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.b2w_platform }}
          path: dist/*.whl

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
